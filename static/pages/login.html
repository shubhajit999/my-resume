<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResumeForge</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🔨 ResumeForge</a>
    <div class="navbar-nav" id="nav-right"></div>
  </nav>

  <div class="container auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to your ResumeForge account</p>
      </div>

      <div id="login-alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up here</a>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfAuthenticated();

      const form = document.getElementById("login-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert("login-alert");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        setBtnLoading("login-btn", true, "Sign In");

        try {
          await api.login(email, password);
          showAlert("login-alert", "Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 500);
        } catch (err) {
          showAlert("login-alert", err.message || "Invalid credentials.");
        } finally {
          setBtnLoading("login-btn", false, "Sign In");
        }
      });
    });
  </script>
</body>
</html>
