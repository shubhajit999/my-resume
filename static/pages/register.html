<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ResumeForge</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🔨 ResumeForge</a>
    <div class="navbar-nav" id="nav-right"></div>
  </nav>

  <div class="container auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Start building your professional resume today</p>
      </div>

      <div id="register-alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" id="full_name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 8 chars)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Log in here</a>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfAuthenticated();

      const form = document.getElementById("register-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert("register-alert");

        const fullName = document.getElementById("full_name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (password.length < 8) {
          showAlert("register-alert", "Password must be at least 8 characters long.");
          return;
        }

        setBtnLoading("register-btn", true, "Create Account");

        try {
          await api.register(email, fullName, password);
          showAlert("register-alert", "Account created successfully! Logging you in...", "success");
          
          // Auto login after registration
          await api.login(email, password);
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 500);
        } catch (err) {
          showAlert("register-alert", err.message || "Registration failed.");
        } finally {
          setBtnLoading("register-btn", false, "Create Account");
        }
      });
    });
  </script>
</body>
</html>
