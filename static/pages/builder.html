<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder - MyResume</title>
  <script>
    if (localStorage.getItem("myresume_theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/builder.css">
  <link rel="stylesheet" href="/static/css/templates.css">
</head>
<body style="height: 100vh; overflow: hidden;">
  <!-- Navigation / Header -->
  <nav class="builder-navbar">
    <div style="display: flex; align-items: center; gap: 0.85rem;">
      <a href="/dashboard" class="btn-builder-back">
        ← Dashboard
      </a>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <div class="builder-logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <path d="M14 2V8H20" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <input type="text" id="resume-title-input" class="form-control builder-title-input" value="Untitled Resume" title="Resume Title">
      </div>
    </div>

    <div class="builder-nav-status">
      <span id="save-status-indicator" class="status-indicator status-saved">✓ All changes saved</span>
      
      <select id="template-select" class="form-control builder-select" title="Template Selector">
        <option value="modern">1. Modern</option>
        <option value="professional">2. Professional</option>
        <option value="minimal">3. Minimal</option>
        <option value="ats">4. ATS-Friendly</option>
        <option value="creative">5. Creative</option>
        <option value="corporate">6. Corporate</option>
        <option value="executive">7. Executive</option>
        <option value="student">8. Student / Fresher</option>
        <option value="two_column">9. Two-Column</option>
        <option value="elegant">10. Elegant</option>
      </select>

      <button type="button" onclick="openTemplateGallery()" class="btn btn-secondary" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
        🎨 Gallery
      </button>

      <button type="button" id="theme-toggle-btn" class="btn btn-secondary" onclick="toggleTheme()" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;" aria-label="Toggle Light or Dark Mode">
        <span class="sidebar-nav-icon">🌙</span>
        <span>Dark Mode</span>
      </button>

      <input type="color" id="theme-color-input" class="color-picker-input" value="#2563eb" title="Choose Primary Theme Color">

      <button type="button" onclick="api.openPrintView(resumeState.id)" class="btn btn-secondary" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
        🖨️ PDF Print View
      </button>

      <button type="button" onclick="api.exportJSON(resumeState.id, resumeState.title)" class="btn btn-secondary" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
        📥 Export JSON
      </button>

      <button id="save-resume-btn" onclick="saveResume()" class="btn btn-primary" style="width: auto; padding: 0.45rem 1.1rem; font-size: 0.85rem;">
        Save Resume
      </button>
    </div>
  </nav>

  <!-- Mobile View Toggle Bar -->
  <div class="view-toggle-bar">
    <button id="mobile-edit-tab" class="tab-btn active" onclick="toggleMobileView('edit')">✏️ Edit Form</button>
    <button id="mobile-preview-tab" class="tab-btn" onclick="toggleMobileView('preview')">👁️ Live Preview</button>
  </div>

  <!-- Split Screen Layout -->
  <div class="builder-layout">
    <!-- Left Editor Pane -->
    <div class="editor-pane">
      <div id="builder-alert" class="alert alert-error" style="display: none; margin: 0.75rem 1rem 0 1rem;"></div>
      
      <!-- Resume Template Selection Section -->
      <div class="builder-section template-picker-section">
        <div class="builder-section-header">
          <div>
            <span class="builder-section-title">🎨 Resume Templates</span>
            <span style="display: block; font-size: 0.8rem; color: #64748b; margin-top: 2px;">Choose a style for your resume</span>
          </div>
          <button type="button" onclick="openTemplateGallery()" class="btn btn-secondary" style="width: auto; padding: 0.3rem 0.75rem; font-size: 0.8rem;">
            Gallery (10)
          </button>
        </div>
        <div id="template-ribbon-container" class="template-ribbon" role="region" aria-label="Resume Templates Selection">
          <!-- Dynamically populated horizontal template selector -->
        </div>
      </div>

      <!-- Personal Information Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">👤 Personal Information</span>
        </div>
        <!-- Profile Photo Control -->
        <div class="photo-upload-container">
          <div class="photo-preview-wrapper" id="photo-preview-wrapper">
            <img id="photo-preview-img" class="photo-preview-img" src="" alt="Profile Photo Preview" style="display: none;">
            <div id="photo-placeholder" class="photo-placeholder">👤</div>
          </div>
          <div class="photo-controls">
            <input type="file" id="photo-file-input" accept="image/jpeg,image/png,image/webp" style="display: none;" onchange="handlePhotoUpload(event)">
            <button type="button" id="photo-choose-btn" class="btn btn-secondary" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="document.getElementById('photo-file-input').click()">Choose Photo</button>
            <button type="button" id="photo-replace-btn" class="btn btn-secondary" style="display: none; width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="document.getElementById('photo-file-input').click()">Replace Photo</button>
            <button type="button" id="photo-remove-btn" class="btn btn-danger-outline" style="display: none;" onclick="removePhoto()">Remove Photo</button>
            <span class="photo-hint">Accepted: JPEG, PNG, WebP (Max 2MB)</span>
          </div>
        </div>
        <div id="photo-error" class="photo-error-msg" style="display: none;"></div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="personal-full_name" class="form-control" placeholder="Jane Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="personal-email" class="form-control" placeholder="jane@example.com">
          </div>
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" id="personal-phone" class="form-control" placeholder="+1 (555) 000-0000">
          </div>
          <div class="form-group">
            <label class="form-label">Location</label>
            <input type="text" id="personal-location" class="form-control" placeholder="San Francisco, CA">
          </div>
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">LinkedIn URL</label>
            <input type="text" id="personal-linkedin_url" class="form-control" placeholder="linkedin.com/in/username">
          </div>
          <div class="form-group">
            <label class="form-label">GitHub / Portfolio URL</label>
            <input type="text" id="personal-github_url" class="form-control" placeholder="github.com/username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Professional Summary</label>
          <textarea id="personal-summary" class="form-control" rows="3" placeholder="Brief summary of your professional experience and key qualifications..."></textarea>
        </div>
      </div>

      <!-- Work Experience Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">💼 Work Experience</span>
        </div>
        <div id="work-experiences-list"></div>
        <button onclick="addWorkExperience()" class="btn-add-item">+ Add Work Experience</button>
      </div>

      <!-- Education Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">🎓 Education</span>
        </div>
        <div id="education-list"></div>
        <button onclick="addEducation()" class="btn-add-item">+ Add Education</button>
      </div>

      <!-- Skills Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">⚡ Skills</span>
        </div>
        <div id="skills-list"></div>
        <button onclick="addSkill()" class="btn-add-item">+ Add Skill</button>
      </div>

      <!-- Projects Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">🚀 Projects</span>
        </div>
        <div id="projects-list"></div>
        <button onclick="addProject()" class="btn-add-item">+ Add Project</button>
      </div>

      <!-- Certifications Section -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">📜 Certifications</span>
        </div>
        <div id="certifications-list"></div>
        <button onclick="addCertification()" class="btn-add-item">+ Add Certification</button>
      </div>

      <!-- Custom Sections -->
      <div class="builder-section">
        <div class="builder-section-header">
          <span class="builder-section-title">✨ Custom Sections</span>
        </div>
        <div id="custom-sections-list"></div>
        <button onclick="addCustomSection()" class="btn-add-item">+ Add Custom Section</button>
      </div>

    </div>

    <!-- Right Live Preview Pane -->
    <div class="preview-pane">
      <div id="resume-paper" class="resume-paper template-modern">
        <!-- Live preview rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Template Gallery Modal -->
  <div id="template-gallery-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🎨 Choose a Professional Template</div>
        <button onclick="closeTemplateGallery()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="template-grid-container" class="template-grid">
          <!-- Template Cards Rendered Dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/builder.js"></script>
</body>
</html>
